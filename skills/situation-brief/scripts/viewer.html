<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상황 브리핑</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#656d76;--line:#d8dee4;--card:#f6f8fa;--accent:#4f46e5;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#e6e8eb;--muted:#9aa3ad;--line:#30363d;--card:#1f2329;--accent:#8b85f5;--warn:#f0a53a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:4px;flex-wrap:wrap;z-index:2}
nav button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}nav button.on{background:var(--card);color:var(--fg);font-weight:600}
main{max-width:980px;margin:auto;padding:20px 16px 60px}h2{margin:24px 0 8px;font-size:18px}h3{margin:0 0 4px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}.muted{color:var(--muted);font-size:13px}.warn{color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--card)}
.scroll{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}td.wrap{white-space:normal;min-width:180px}
.bar{display:grid;grid-template-columns:minmax(80px,200px) 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:3px 0}.track{background:var(--line);border-radius:4px;height:14px}.fill{background:var(--accent);height:14px;border-radius:4px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px;margin-right:4px}select,input{font:inherit;padding:5px 8px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;margin:4px 6px 8px 0;max-width:100%}
svg{width:100%;height:auto}svg text{fill:var(--muted);font-size:11px}
</style></head><body><nav id="nav"></nav><main id="main"></main>
<script>
const D = __DATA__, B = D.brief, main = document.getElementById('main'), nav = document.getElementById('nav');
const e = (t, a = {}, ...c) => { const n = document.createElement(t); for (const k in a) k === 'text' ? n.textContent = a[k] : n.setAttribute(k, a[k]); n.append(...c); return n; };
const list = (items, f) => { const u = e('ul'); (items || []).forEach(i => u.append(e('li', {}, f ? f(i) : String(i)))); return u; };
const card = (...c) => e('div', { class: 'card' }, ...c);
const table = (heads, rows, wrap = []) => { const t = e('table'), h = e('tr'); heads.forEach(x => h.append(e('th', { text: x }))); t.append(e('thead', {}, h)); const b = e('tbody'); rows.forEach(r => { const tr = e('tr'); r.forEach((v, i) => tr.append(e('td', { text: v ?? '', class: wrap.includes(i) ? 'wrap' : '' }))); b.append(tr); }); t.append(b); return e('div', { class: 'scroll' }, t); };
function chart(v) {
  const box = card(e('h3', { text: v.title }), e('div', { class: 'muted', text: v.question }));
  const series = [...new Set(v.points.map(p => p.series))], xs = [...new Set(v.points.map(p => p.x))];
  const isTime = /^\d{4}-\d{2}/.test(xs[0] || '') && xs.length > 12;
  if (!v.points.length) box.append(e('p', { class: 'warn', text: '조건에 맞는 데이터가 없습니다.' }));
  else if (isTime) box.append(line(v, xs, series));
  else { const max = Math.max(...v.points.map(p => p.y || 0), 1); series.forEach(s => { if (s) box.append(e('div', { class: 'muted', style: 'margin-top:8px', text: s })); v.points.filter(p => p.series === s).forEach(p => { const f = e('div', { class: 'fill', style: `width:${(p.y || 0) / max * 100}%` }); box.append(e('div', { class: 'bar' }, e('div', { text: p.x }), e('div', { class: 'track' }, f), e('div', { text: `${p.y ?? '-'}${v.unit}` }))); }); }); }
  if (v.reading) box.append(e('p', { class: 'muted', text: '읽는 법: ' + v.reading }));
  box.append(e('div', { class: 'muted', text: `출처 ${v.file} · 계산에 쓴 줄 ${v.rows_used}개` }));
  return box;
}
function line(v, xs, series) {
  const W = 900, H = 240, P = 40, ys = v.points.map(p => p.y || 0), max = Math.max(...ys, 1);
  const X = i => P + i * (W - 2 * P) / Math.max(xs.length - 1, 1), Y = y => H - 24 - y / max * (H - 44), colors = ['#4f46e5', '#0891b2', '#d97706', '#be185d', '#16a34a', '#6b7280'];
  let s = `<svg viewBox="0 0 ${W} ${H}"><text x="2" y="16">${max}${v.unit}</text><text x="2" y="${H - 24}">0</text><text x="${P}" y="${H - 6}">${xs[0]}</text><text x="${W - P - 70}" y="${H - 6}">${xs[xs.length - 1]}</text>`;
  series.forEach((name, n) => { const pts = v.points.filter(p => p.series === name).map(p => `${X(xs.indexOf(p.x))},${Y(p.y || 0)}`).join(' '); s += `<polyline fill="none" stroke="${colors[n % 6]}" stroke-width="2" points="${pts}"/>`; });
  const w = e('div'); w.innerHTML = s + '</svg>'; if (series.length > 1) w.append(e('div', { class: 'muted', text: series.join(' / ') + ' (선 색은 이 순서: 남색·청록·주황·분홍·초록·회색)' })); return w;
}
const tabs = {
  '상황': () => { main.append(card(e('p', { text: B.summary || '' }), e('p', { class: 'muted', text: B.analogy ? '비유: ' + B.analogy : '' })));
    main.append(e('h2', { text: '누가 무엇을 겪나' }), table(['누가', '하는 일', '힘든 점'], (B.people || []).map(p => [p.who, p.does, p.pain]), [1, 2]));
    main.append(e('h2', { text: '지금 일의 흐름' }), e('ol', {}, ...(B.flow || []).map(x => e('li', { text: x }))));
    main.append(e('h2', { text: '용어' }), table(['용어', '뜻'], (B.terms || []).map(t => [t.term, t.meaning]), [1]));
    main.append(e('h2', { text: '실무자에게 물어볼 것' }), list(B.ask)); },
  '이야기 ↔ 데이터': () => { (B.stories || []).forEach(s => { main.append(card(e('h3', { text: `“${s.quote}”` }), e('div', { class: 'muted', text: '확인: ' + s.check }))); const v = (B.views || []).find(x => x.title === s.view); if (v) main.append(chart(v)); else main.append(e('p', { class: 'muted', text: '→ 이 데이터로는 확인할 수 없습니다. 실무자에게 물어보세요.' })); });
    const used = new Set((B.stories || []).map(s => s.view)); const rest = (B.views || []).filter(v => !used.has(v.title)); if (rest.length) main.append(e('h2', { text: '다른 차트' })); rest.forEach(v => main.append(chart(v))); },
  '데이터 사전': () => { if (D.errors.length) main.append(card(e('b', { class: 'warn', text: '차트 오류' }), list(D.errors)));
    if ((B.cautions || []).length) main.append(card(e('h3', { class: 'warn', text: '조심할 점' }), list(B.cautions)));
    Object.entries(D.profile).forEach(([name, p]) => { const f = (B.files || []).find(x => x.file === name) || {}; main.append(e('h2', { text: `${name} (${p.rows}줄)` })); if (f.row_means) main.append(e('p', { text: '한 줄의 뜻: ' + f.row_means })); if (f.use) main.append(e('p', { class: 'muted', text: '알 수 있는 것: ' + f.use }));
      main.append(table(['컬럼', '뜻', '종류', '빈 칸', '값 범위 / 많은 값'], p.columns.map(c => [c.name, (f.columns || {})[c.name], c.type, c.missing, c.type === 'number' ? `${c.min} ~ ${c.max} (평균 ${c.mean}, 0은 ${c.zeros}줄)` : c.type === 'date' ? `${c.min} ~ ${c.max} (${c.days}일)` : (c.top || []).slice(0, 4).map(t => `${t[0]}(${t[1]})`).join(', ')]), [1, 4]));
      if (p.signals.length) main.append(card(e('h3', { text: '자동으로 찾은 신호' }), list(p.signals, s => `[${s.kind}] ${s.column}: ${s.detail}`))); }); },
  '원본': () => { const names = Object.keys(D.raw), sel = e('select'), q = e('input', { placeholder: '이 표에서 찾기' }), out = e('div'); names.forEach(n => sel.append(e('option', { value: n, text: n }))); const draw = () => { const rows = D.raw[sel.value], keys = Object.keys(rows[0] || {}), k = q.value.trim(); const hit = rows.filter(r => !k || Object.values(r).join(' ').includes(k)); out.replaceChildren(e('div', { class: 'muted', text: `앞부분 ${rows.length}줄 중 ${hit.length}줄 (전체 ${D.profile[sel.value].rows}줄)` }), table(keys, hit.map(r => keys.map(c => r[c])))); }; sel.onchange = q.oninput = draw; main.append(sel, q, out); draw(); },
};
if ((B.cases || []).length) tabs['다른 곳 사례'] = () => B.cases.forEach(c => { const a = c.url ? e('a', { href: c.url, target: '_blank', text: '출처' }) : e('span', { class: 'warn', text: '출처 없음·미확인' }); main.append(card(e('h3', { text: c.where }), e('p', { text: '어떻게: ' + c.how }), e('p', { text: '결과: ' + c.result }), e('p', { class: 'muted', text: '다를 수 있는 점: ' + c.differs }), e('p', { text: '물어볼 것: ' + c.ask }), a)); });
const show = name => { main.replaceChildren(); [...nav.children].forEach(b => b.classList.toggle('on', b.textContent === name)); tabs[name](); window.scrollTo(0, 0); };
Object.keys(tabs).forEach(n => nav.append(e('button', { text: n }))); [...nav.children].forEach(b => b.onclick = () => show(b.textContent)); show('상황');
</script></body></html>
